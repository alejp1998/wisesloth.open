repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^express-app/tsconfig\.json$
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^fastapi-api/
      - id: ruff-format
        files: ^fastapi-api/
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: express-app/node_modules/.bin/eslint
        language: system
        files: ^express-app/.*\.js$
